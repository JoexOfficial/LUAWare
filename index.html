<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUAWare | Register</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; font-family:'Inter',sans-serif; margin:0; padding:0; }
body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at top,#0f172a,#020617); color:#e5e7eb; user-select:none; }
.box { position:relative; width:420px; padding:42px 36px 36px; border-radius:18px; background:rgba(2,6,23,0.85); border:1px solid #1e293b; backdrop-filter:blur(14px); box-shadow:0 40px 90px rgba(0,0,0,0.5); animation:slideUp 0.8s ease; }
@keyframes slideUp { from { opacity:0; transform:translateY(40px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.back { position:absolute; top:16px; left:16px; padding:6px 10px; border-radius:8px; background:rgba(15,23,42,0.8); border:1px solid #1e293b; font-size:14px; font-weight:500; color:#94a3b8; text-decoration:none; transition:all 0.2s; }
.back:hover { color:#38bdf8; border-color:#38bdf8; transform:translateX(-3px); }
h1 { text-align:center; font-size:30px; margin-bottom:8px; background:linear-gradient(90deg,#38bdf8,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
p { text-align:center; font-size:14px; color:#94a3b8; margin-bottom:30px; }
label { font-size:14px; color:#cbd5f5; }
input { width:100%; margin:8px 0 10px; padding:12px 14px; border-radius:10px; border:1px solid #1e293b; background:#020617; color:#e5e7eb; font-size:15px; transition:border 0.2s, box-shadow 0.2s; }
input:focus { outline:none; border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,0.15); }
button { width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer; font-weight:600; font-size:16px; background:linear-gradient(90deg,#38bdf8,#6366f1); color:#020617; box-shadow:0 12px 30px rgba(56,189,248,0.35); transition:transform 0.15s, box-shadow 0.15s; margin-top:12px; }
button:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(56,189,248,0.45); }
.footer { text-align:center; margin-top:22px; font-size:14px; color:#94a3b8; }
.footer a { color:#38bdf8; text-decoration:none; font-weight:500; }

/* ================= ERROR MSG ================= */
.error-msg {
  font-size: 13px;
  color: #f87171;
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid #f87171;
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 12px;
  display: none;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div class="box">
  <a href="/Visuals/Main.html" class="back">Back</a>

  <h1>LUAWare</h1>
  <p>Create your account</p>

  <form id="registerForm">
    <label>Username</label>
    <input type="text" name="username" required>
    <div id="usernameError" class="error-msg"></div>

    <label>Email</label>
    <input type="email" name="email" required>
    <div id="emailError" class="error-msg"></div>

    <label>Password</label>
    <input type="password" name="password" required>
    <div id="passwordError" class="error-msg"></div>

    <button type="submit">Register</button>
  </form>

  <div class="footer">
    Already have an account? <a href="/Visuals/Login.html">Login</a>
  </div>
</div>

<script>
const form = document.getElementById("registerForm");
const workerUrl = "https://luaware.joex-360hz.workers.dev";

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = "block";
}

function clearErrors() {
  document.querySelectorAll(".error-msg").forEach(e => e.style.display="none");
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  clearErrors();

  const username = form.username.value.trim();
  const email = form.email.value.trim();
  const password = form.password.value;

  try {
    const res = await fetch(`${workerUrl}/api/register`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if(data.success){
      window.location.href = "/Visuals/Login.html";
    } else if(data.errors){
      // show multiple errors
      if(data.errors.username) showError("usernameError", data.errors.username);
      if(data.errors.email) showError("emailError", data.errors.email);
    } else {
      showError("usernameError", data.error || "Registration failed");
    }
  } catch(err) {
    showError("usernameError", "Error connecting to server");
    console.error(err);
  }
});

</script>

</body>
</html>
